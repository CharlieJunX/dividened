name: Weekly global stock Telegram

on:
  schedule:
    # Wednesday 07:00 UTC = Wednesday 16:00 Asia/Seoul.
    - cron: '0 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: daily-stock-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m pytest -v
      - name: Install optional durable state client
        if: ${{ vars.FUNDAMENTAL_STATE_BUCKET != '' }}
        run: python -m pip install 'awscli>=1.32,<2'
      - name: Restore durable financial state
        if: ${{ vars.FUNDAMENTAL_STATE_BUCKET != '' }}
        env:
          FUNDAMENTAL_STATE_BUCKET: ${{ vars.FUNDAMENTAL_STATE_BUCKET }}
          FUNDAMENTAL_STATE_KEY: ${{ vars.FUNDAMENTAL_STATE_KEY }}
          FUNDAMENTAL_STATE_INITIALIZE: ${{ vars.FUNDAMENTAL_STATE_INITIALIZE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FUNDAMENTAL_STATE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FUNDAMENTAL_STATE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.FUNDAMENTAL_STATE_AWS_REGION }}
        run: python fundamental_state_sync.py restore
      - name: Explain missing persistent state
        if: ${{ vars.FUNDAMENTAL_STATE_BUCKET == '' }}
        run: echo '::warning::No durable financial state configured. Cross-run history and alert deduplication require versioned S3; see README.'
      - name: Collect and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python daily_runner.py --market all
      - name: Persist durable financial state
        if: ${{ always() && vars.FUNDAMENTAL_STATE_BUCKET != '' && vars.FUNDAMENTAL_STATE_WRITE_APPROVED == 'true' && hashFiles('state/fundamentals.sqlite3') != '' }}
        env:
          FUNDAMENTAL_STATE_BUCKET: ${{ vars.FUNDAMENTAL_STATE_BUCKET }}
          FUNDAMENTAL_STATE_KEY: ${{ vars.FUNDAMENTAL_STATE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.FUNDAMENTAL_STATE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FUNDAMENTAL_STATE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.FUNDAMENTAL_STATE_AWS_REGION }}
        run: python fundamental_state_sync.py save
      - name: Upload results and source timestamps
        id: upload_results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-results-${{ github.run_number }}
          path: reports/
          if-no-files-found: warn
          overwrite: true
          # Count-based cleanup below; expiry follows repository policy.
      - name: Keep results from the latest two workflow runs
        if: ${{ always() && steps.upload_results.outcome == 'success' && steps.upload_results.outputs['artifact-id'] != '' }}
        uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              ...repo, run_id: context.runId
            });
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: currentRun.workflow_id, per_page: 100
            });
            const runNumbers = new Map(runs.map(run => [run.id, run.run_number]));
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...repo, per_page: 100
            });
            const results = artifacts.filter(artifact =>
              /^stock-results-\d+$/.test(artifact.name) &&
              runNumbers.has(artifact.workflow_run?.id)
            );
            const resultRuns = [...new Set(results
              .filter(artifact => !artifact.expired)
              .map(artifact => artifact.workflow_run.id))]
              .sort((a, b) => runNumbers.get(b) - runNumbers.get(a));
            const keep = new Set(resultRuns.slice(0, 2));
            for (const artifact of results) {
              if (keep.has(artifact.workflow_run.id) && !artifact.expired) continue;
              try {
                await github.rest.actions.deleteArtifact({ ...repo, artifact_id: artifact.id });
                core.info(`Deleted old results: ${artifact.name}`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
